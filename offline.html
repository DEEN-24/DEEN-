
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062b23">
<title>Offline | DEEN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #faf8f1;
  color: #20332c;
  font-family: Arial, sans-serif;
  text-align: center;
}

main {
  width: 100%;
  max-width: 420px;
  padding: 35px 24px;
  background: white;
  border: 1px solid #e7e3d6;
  border-radius: 22px;
  box-shadow: 0 12px 40px #062b2315;
}

img {
  width: 85px;
  height: 85px;
  object-fit: contain;
  border-radius: 50%;
}

h1 {
  color: #062b23;
  font-size: 27px;
}

p {
  line-height: 1.8;
  color: #667770;
}

button {
  padding: 13px 25px;
  border: 0;
  border-radius: 30px;
  background: #062b23;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>
<main>

<img src="./images/logo.jpg" alt="DEEN Logo">

<h1>আপনি অফলাইনে আছেন!</h1>

<p>
ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না।
সংযোগ ফিরে এলে আবার চেষ্টা করুন।
DEEN-এর সংরক্ষিত কিছু কনটেন্ট
অফলাইনে দেখা যেতে পারে।
</p>

<button onclick="location.reload()">
আবার চেষ্টা করুন
</button>

<p><b>DEEN</b> — Knowledge Changes Lives</p>

</main>
</body>
</html>
